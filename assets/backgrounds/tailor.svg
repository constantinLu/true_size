<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C2E2B"/>
      <stop offset="1" stop-color="#06110F"/>
    </linearGradient>
    <pattern id="tape" width="48" height="48" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <line x1="0" y1="0" x2="0" y2="20" stroke="#63D6C4" stroke-opacity="0.18" stroke-width="2"/>
      <line x1="24" y1="0" x2="24" y2="12" stroke="#63D6C4" stroke-opacity="0.12" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1080" height="1920" fill="url(#bg)"/>
  <rect width="1080" height="1920" fill="url(#tape)"/>
</svg>
