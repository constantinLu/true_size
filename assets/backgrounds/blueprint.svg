<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10203F"/>
      <stop offset="1" stop-color="#060B18"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#5B8DEF" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
    <pattern id="gridBig" width="300" height="300" patternUnits="userSpaceOnUse">
      <path d="M300 0H0V300" fill="none" stroke="#5B8DEF" stroke-opacity="0.16" stroke-width="1.5"/>
    </pattern>
  </defs>
  <rect width="1080" height="1920" fill="url(#bg)"/>
  <rect width="1080" height="1920" fill="url(#grid)"/>
  <rect width="1080" height="1920" fill="url(#gridBig)"/>
  <g stroke="#9FC0FF" stroke-opacity="0.5">
    <line x1="0" y1="120" x2="1080" y2="120" stroke-width="2"/>
    <g stroke-width="2">
      <line x1="60" y1="120" x2="60" y2="150"/><line x1="120" y1="120" x2="120" y2="168"/>
      <line x1="180" y1="120" x2="180" y2="150"/><line x1="240" y1="120" x2="240" y2="168"/>
      <line x1="300" y1="120" x2="300" y2="150"/><line x1="360" y1="120" x2="360" y2="180"/>
      <line x1="420" y1="120" x2="420" y2="150"/><line x1="480" y1="120" x2="480" y2="168"/>
      <line x1="540" y1="120" x2="540" y2="150"/><line x1="600" y1="120" x2="600" y2="168"/>
      <line x1="660" y1="120" x2="660" y2="150"/><line x1="720" y1="120" x2="720" y2="180"/>
      <line x1="780" y1="120" x2="780" y2="150"/><line x1="840" y1="120" x2="840" y2="168"/>
      <line x1="900" y1="120" x2="900" y2="150"/><line x1="960" y1="120" x2="960" y2="168"/>
      <line x1="1020" y1="120" x2="1020" y2="150"/>
    </g>
