name: true_size
description: A comprehensive size and measurement tracking app
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Stacked Architecture
  stacked: ^3.4.0
  stacked_services: ^1.2.0
  sizer: ^3.0.5
#  stacked_themes: ^0.3.15
  stacked_hooks: ^0.2.4
  #stacked_themes: ^0.3.15

  # Responsive Design
  responsive_builder: ^0.7.0

  # Firebase
  firebase_core: ^2.32.0
  firebase_auth: ^4.20.0
  cloud_firestore: ^4.17.5
  google_sign_in: ^6.2.1



  # UI Components
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0
  hugeicons: ^0.0.11
  flex_color_scheme: ^8.2.0
  google_fonts: ^6.2.1

  # State Management & Navigation
  get_it: ^8.0.2
  auto_route: ^7.8.4

  # Utilities
  uuid: ^4.5.1

  intl: ^0.18.1

  # Development
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.7
  stacked_generator: ^1.5.0
  auto_route_generator: ^7.3.2
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/logos/

  fonts:
    - family: Lexend
      fonts:
        - asset: assets/font/Lexend-Thin.ttf
          weight: 100
        - asset: assets/font/Lexend-ExtraLight.ttf
          weight: 200
        - asset: assets/font/Lexend-Light.ttf
          weight: 300
        - asset: assets/font/Lexend-Regular.ttf
          weight: 400
        - asset: assets/font/Lexend-Medium.ttf
          weight: 500
        - asset: assets/font/Lexend-SemiBold.ttf
          weight: 600
        - asset: assets/font/Lexend-Bold.ttf
          weight: 700
        - asset: assets/font/Lexend-ExtraBold.ttf
          weight: 800
        - asset: assets/font/Lexend-Black.ttf
          weight: 900

    - family: AROneSans
      fonts:
        - asset: assets/font/AROneSans-Regular.ttf
          weight: 400
        - asset: assets/font/AROneSans-Medium.ttf
          weight: 500
        - asset: assets/font/AROneSans-SemiBold.ttf
          weight: 600
        - asset: assets/font/AROneSans-Bold.ttf
          weight: 700