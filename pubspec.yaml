name: true_size
description: A comprehensive size and measurement tracking app
version: 1.0.6+7

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Stacked Architecture
  stacked: ^3.4.0
  stacked_services: ^1.2.0
  sizer: ^3.0.5
#  stacked_themes: ^0.3.15
  stacked_hooks: ^0.2.4
  #stacked_themes: ^0.3.15

  # Responsive Design
  responsive_builder: ^0.7.0

  # Firebase
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  google_sign_in: ^7.2.0



  # UI Components
  flutter_svg: ^2.0.9
  cached_network_image: ^4.0.0
  google_fonts: ^8.2.1
  lucide_icons_flutter: ^3.1.17

  # Brand logo lookup (logo.dev image API) + attribution link.
  http: ^1.2.2
  url_launcher: ^6.3.1

  # Avatar photo picking for the profile screen.
  image_picker: ^1.2.3

  # Biometric (fingerprint / face) unlock when the user is already logged in.
  local_auth: ^3.0.2

  # App version shown in Settings > About.
  package_info_plus: ^10.2.1

  # Forced self-update for the sideloaded APK (downloads + installs latest.apk
  # from the DEV Play store when a newer build is published).
  ota_update: ^7.1.0

  # State Management & Navigation
  get_it: ^8.0.2
  auto_route: ^11.1.0

  # Utilities
  uuid: ^4.5.1

  intl: ^0.20.3

  # Development
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.7
  stacked_generator: ^2.0.4
  auto_route_generator: ^10.6.0
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# App launcher icon (Android app-drawer / home-screen). Generated from the
# TrueSize logo with `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logos/app_icon.png"
  # The full logo lives on the background layer so it fills the whole icon edge
  # to edge (the foreground layer is inset by the launcher, which is what made
  # it look like a smaller circle on a coloured disc). Foreground is empty.
  adaptive_icon_background: "assets/logos/app_icon.png"
  adaptive_icon_foreground: "assets/logos/app_icon_transparent.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/logos/
    - assets/fonts/
    - assets/backgrounds/
    - assets/body/male/
    - assets/body/female/

  fonts:
    - family: Office Code Pro
      fonts:
        - asset: assets/fonts/OfficeCodePro-Regular.otf
          weight: 400
        - asset: assets/fonts/OfficeCodePro-Medium.otf
          weight: 500
        - asset: assets/fonts/OfficeCodePro-Bold.otf
          weight: 700

    - family: Lexend
      fonts:
        - asset: assets/font/Lexend-Thin.ttf
          weight: 100
        - asset: assets/font/Lexend-ExtraLight.ttf
          weight: 200
        - asset: assets/font/Lexend-Light.ttf
          weight: 300
        - asset: assets/font/Lexend-Regular.ttf
          weight: 400
        - asset: assets/font/Lexend-Medium.ttf
          weight: 500
        - asset: assets/font/Lexend-SemiBold.ttf
          weight: 600
        - asset: assets/font/Lexend-Bold.ttf
          weight: 700
        - asset: assets/font/Lexend-ExtraBold.ttf
          weight: 800
        - asset: assets/font/Lexend-Black.ttf
          weight: 900

    - family: AROneSans
      fonts:
        - asset: assets/font/AROneSans-Regular.ttf
          weight: 400
        - asset: assets/font/AROneSans-Medium.ttf
          weight: 500
        - asset: assets/font/AROneSans-SemiBold.ttf
          weight: 600
        - asset: assets/font/AROneSans-Bold.ttf
          weight: 700